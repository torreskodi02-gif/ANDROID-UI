// Merlin Launcher — root build file.
// Declares the plugin versions so `gradle :app:assembleDebug` (locally and
// in GitHub Actions) can resolve com.android.application and kotlin-android.
// AGP 8.5.2 + Kotlin 2.0.21 are a proven pair for Gradle 8.7 / compileSdk 34.
plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
