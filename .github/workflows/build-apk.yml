# Build APK (Merlin Launcher)
#
# Kodi pastes this file to .github/workflows/build-apk.yml via the GitHub
# web editor, because the GitHub App cannot push workflow files (403).
#
# NOTE: unlike the Quantum Signal workflow this one calls `gradle` directly
# (installed by gradle/actions/setup-gradle) instead of ./gradlew, because
# this repo has no Gradle wrapper checked in yet.
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      # versionCode is 10000 + run number, so Android always accepts this
      # APK as an update to the installed app.
      - run: gradle :app:assembleDebug --no-daemon
        env:
          VC: ${{ 10000 + github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: merlin-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to a permanent download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk merlin-launcher.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest merlin-launcher.apk --target "$GITHUB_SHA" --title "Merlin Launcher (newest build)" --notes "Built from commit ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d %H:%M') UTC. versionCode $((10000 + GITHUB_RUN_NUMBER))" --latest